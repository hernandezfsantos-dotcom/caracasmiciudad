<!doctype html><html lang="es-VE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mercado de prueba · caracas.hoy</title><link rel="stylesheet" href="assets/geist.css"><link rel="stylesheet" href="assets/demo.css"></head><body><header><a class="brand" href="./">caracas<span>.</span><em>hoy</em></a><a href="#cuenta">Mi cuenta</a></header><main><h1>Mercado de prueba</h1><p>Prueba con un alias y una clave de prueba. Las cuentas, ofertas y compras se guardan en este navegador. No se realizan cobros.</p><section id="cuenta"><h2>Mi cuenta</h2><div id="guest"><form id="login"><label>Alias<input name="alias" maxlength="40" required autocomplete="username"></label><label>Clave de prueba<input name="clave" type="password" minlength="8" maxlength="100" required autocomplete="off"></label><label class="accept"><input type="checkbox" name="terms"> Al registrarme, acepto que caracas.hoy recibe el 15 % de cada venta confirmada y el organizador recibe el 85 %.</label><div><button value="register">Crear cuenta de prueba</button> <button value="login">Entrar</button></div></form></div><div id="member" hidden><strong id="who"></strong> · <button id="logout">Salir</button> · <a href="#gestion">Gestionar mis ofertas</a></div></section><p id="notice" role="status"></p><section><h2>Planes en Caracas</h2><div id="catalog"></div></section><section id="gestion" hidden><h2>Mis ofertas</h2><div id="mine"></div><h3 id="editor-title">Crear una oferta</h3><form id="editor"><label>Actividad<input name="title" required maxlength="95"></label><label>Lugar y barrio<input name="area" required maxlength="100"></label><label>Fecha y hora en Caracas<input name="date" type="datetime-local" required></label><label>Precio por persona en USD<input name="price" type="number" step=".01" min=".01" max="100000" required></label><label>Cupos totales<input name="capacity" type="number" min="1" max="5000" required></label><label>Foto de muestra<select name="image"></select></label><output id="net"></output><div><button>Guardar oferta</button> <button id="reset" type="button">Limpiar</button></div></form><h2>Mis compras y ventas</h2><div id="history"></div></section></main><dialog id="pay"><h2>Compra de prueba</h2><p id="summary"></p><button id="confirm">Pagar entrada de prueba</button> <button id="cancel">Volver</button></dialog><script src="assets/puerta.js"></script><script src="assets/ticket-qr.js"></script><script src="assets/demo-store.js"></script><script src="assets/demo.js" defer></script></body></html>
